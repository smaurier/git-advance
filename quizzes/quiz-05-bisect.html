<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 05 — Git Bisect & Debugging</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 05 — Git Bisect & Debugging</h1>
    <p class="subtitle">Recherche binaire automatisée de bugs</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1 — Algorithme",
        text: "Quel algorithme utilise <code>git bisect</code> pour trouver le commit qui a introduit un bug ?",
        options: [
          "Une recherche linéaire du plus récent au plus ancien",
          "Une recherche binaire (dichotomie) sur l'historique des commits",
          "Une recherche par hachage dans la table des objets Git",
          "Un parcours en largeur (BFS) du graphe de commits"
        ],
        answer: 1,
        explanation: "<strong>git bisect</strong> utilise une <strong>recherche binaire</strong> (dichotomie). Il divise l'intervalle de commits en deux à chaque étape, ce qui permet de trouver le commit fautif de manière très efficace."
      },
      {
        label: "Question 2 — Démarrage",
        text: "Quelle est la séquence correcte de commandes pour démarrer une session bisect ?",
        code: "git bisect start\ngit bisect bad           # commit actuel est mauvais\ngit bisect good v2.0.0   # ce tag était bon",
        options: [
          "git bisect init → git bisect mark-bad → git bisect mark-good",
          "git bisect begin → git bisect broken → git bisect working",
          "git bisect start → git bisect bad [ref] → git bisect good [ref]",
          "git bisect run → git bisect fail → git bisect pass"
        ],
        answer: 2,
        explanation: "On démarre avec <strong>git bisect start</strong>, puis on marque un commit mauvais avec <strong>git bisect bad</strong> et un commit bon avec <strong>git bisect good</strong>. Git checkout alors automatiquement le commit du milieu pour le tester."
      },
      {
        label: "Question 3 — Bisect Run",
        text: "Que fait la commande <code>git bisect run</code> ?",
        code: "git bisect start\ngit bisect bad HEAD\ngit bisect good v1.0.0\ngit bisect run npm test",
        options: [
          "Elle lance le rebase automatique des commits marqués comme mauvais",
          "Elle exécute un script/commande automatiquement à chaque étape du bisect pour déterminer si le commit est bon ou mauvais",
          "Elle affiche un rapport des commits entre good et bad",
          "Elle supprime automatiquement les commits identifiés comme mauvais"
        ],
        answer: 1,
        explanation: "<strong>git bisect run</strong> automatise entièrement la recherche. Le script fourni est exécuté à chaque étape : s'il retourne 0 (succès), le commit est marqué « good » ; s'il retourne un code non nul, il est marqué « bad ». Le processus continue jusqu'à trouver le premier commit fautif."
      },
      {
        label: "Question 4 — Bisect Skip",
        text: "Que faire si le commit actuel dans une session bisect ne peut pas être testé (par exemple, il ne compile pas) ?",
        code: "# Le commit actuel ne compile pas...\ngit bisect skip",
        options: [
          "Utiliser git bisect abort pour tout annuler et recommencer",
          "Utiliser git bisect skip pour indiquer que ce commit est non testable",
          "Utiliser git bisect ignore pour l'exclure définitivement",
          "Marquer le commit comme bad car il ne fonctionne pas"
        ],
        answer: 1,
        explanation: "<strong>git bisect skip</strong> indique que le commit courant ne peut pas être testé. Git choisira un commit voisin à la place. Attention : si trop de commits sont skippés dans la même zone, bisect pourrait ne pas trouver le commit exact."
      },
      {
        label: "Question 5 — Complexité",
        text: "Si un projet a 1024 commits entre le dernier « good » et le premier « bad », combien d'étapes git bisect nécessite-t-il au maximum pour trouver le commit fautif ?",
        options: [
          "1024 étapes (recherche linéaire)",
          "512 étapes (la moitié des commits)",
          "10 étapes (log₂(1024) = 10)",
          "32 étapes (√1024 = 32)"
        ],
        answer: 2,
        explanation: "Git bisect utilise une recherche binaire en <strong>O(log₂ n)</strong>. Pour 1024 commits : log₂(1024) = <strong>10 étapes</strong> au maximum. C'est infiniment plus efficace qu'une recherche linéaire en O(n) qui nécessiterait de tester potentiellement les 1024 commits."
      }
    ];

    let current = 0, score = 0, answered = false;
    const container = document.getElementById('quizContainer');
    const scoreContainer = document.getElementById('scoreContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function render() {
      if (current >= questions.length) return showScore();
      const q = questions[current];
      progressBar.style.width = ((current / questions.length) * 100) + '%';
      progressText.textContent = `Question ${current + 1} / ${questions.length}`;
      answered = false;
      let html = `<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;
      if (q.code) html += `<pre><code>${q.code}</code></pre>`;
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"><span>${opt}</span></label></li>`;
      });
      html += `</ul><button class="btn btn-primary" id="submitBtn" disabled onclick="checkAnswer()">Valider</button><div id="feedback" class="feedback"></div></div>`;
      container.innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(input => {
        input.addEventListener('change', () => { if (!answered) document.getElementById('submitBtn').disabled = false; });
      });
    }

    function checkAnswer() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const idx = parseInt(selected.value);
      const q = questions[current];
      const feedback = document.getElementById('feedback');
      if (idx === q.answer) {
        score++;
        feedback.className = 'feedback correct';
        feedback.innerHTML = `✅ Correct ! ${q.explanation}`;
      } else {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `❌ Incorrect. ${q.explanation}`;
      }
      document.getElementById('submitBtn').textContent = 'Suivant →';
      document.getElementById('submitBtn').onclick = () => { current++; render(); };
    }

    function showScore() {
      progressBar.style.width = '100%';
      progressText.textContent = `Terminé !`;
      container.innerHTML = '';
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? '🏆 Parfait !' : pct >= 60 ? '👍 Bien joué !' : '📚 À revoir';
      scoreContainer.innerHTML = `<div class="score">${score}/${questions.length}</div><div class="score-label">${pct}% — ${msg}</div><button class="btn-restart" onclick="location.reload()">🔄 Recommencer</button>`;
      scoreContainer.classList.remove('hidden');
    }

    render();
  </script>
</body>
</html>
