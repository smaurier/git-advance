<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 03 — Merge vs Rebase</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 03 — Merge vs Rebase</h1>
    <p class="subtitle">Fast-forward, 3-way merge, rebase et golden rule</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1 — Fast-Forward Merge",
        text: "Qu'est-ce qu'un fast-forward merge dans Git ?",
        code: "git checkout main\ngit merge feature\n# Fast-forward (pas de commit de merge créé)",
        options: [
          "Un merge qui crée toujours un commit de fusion avec deux parents",
          "Un merge où Git avance simplement le pointeur de la branche cible car il n'y a pas de divergence",
          "Un merge qui supprime automatiquement la branche source",
          "Un merge qui annule les conflits en prenant toujours la version de la branche cible"
        ],
        answer: 1,
        explanation: "Un <strong>fast-forward merge</strong> se produit lorsque la branche cible n'a pas divergé. Git déplace simplement le pointeur de branche vers l'avant, sans créer de commit de merge. L'historique reste linéaire."
      },
      {
        label: "Question 2 — 3-Way Merge",
        text: "Dans quelle situation Git effectue-t-il un 3-way merge (merge à trois voies) ?",
        code: "# main et feature ont divergé :\n#   A---B---C  (main)\n#        \\---D---E  (feature)\ngit checkout main\ngit merge feature\n# → crée un commit de merge M",
        options: [
          "Quand la branche feature n'a qu'un seul commit",
          "Quand les deux branches ont divergé et ont chacune des commits propres",
          "Quand on utilise l'option --squash",
          "Quand il n'y a aucun conflit entre les branches"
        ],
        answer: 1,
        explanation: "Git effectue un <strong>3-way merge</strong> quand les deux branches ont divergé (chacune a des commits que l'autre n'a pas). Git utilise l'ancêtre commun, le sommet de la branche source et le sommet de la branche cible pour calculer la fusion."
      },
      {
        label: "Question 3 — Rebase",
        text: "Que fait la commande <code>git rebase main</code> lorsqu'on est sur une feature branch ?",
        code: "git checkout feature\ngit rebase main\n# Avant :  A---B---C (main)\n#               \\---D---E (feature)\n# Après :  A---B---C (main)\n#                    \\---D'---E' (feature)",
        options: [
          "Elle fusionne main dans feature en créant un commit de merge",
          "Elle supprime les commits de feature et les remplace par ceux de main",
          "Elle rejoue les commits de feature sur le sommet de main, créant de nouveaux commits",
          "Elle déplace la branche main vers le dernier commit de feature"
        ],
        answer: 2,
        explanation: "<strong>git rebase main</strong> prend les commits de la branche courante (feature) et les rejoue un par un sur le sommet de main. Les commits obtiennent de nouveaux SHA car leur parent change. L'historique devient linéaire."
      },
      {
        label: "Question 4 — Golden Rule du Rebase",
        text: "Quelle est la « règle d'or » (golden rule) du rebase ?",
        options: [
          "Toujours rebaser avant de créer une pull request",
          "Ne jamais rebaser des commits qui ont été poussés et partagés avec d'autres développeurs",
          "Toujours utiliser --force après un rebase",
          "Ne jamais rebaser plus de 5 commits à la fois"
        ],
        answer: 1,
        explanation: "La règle d'or du rebase : <strong>ne jamais rebaser des branches publiques/partagées</strong>. Le rebase réécrit l'historique (nouveaux SHA), ce qui cause des problèmes pour les autres développeurs qui ont basé leur travail sur les anciens commits."
      },
      {
        label: "Question 5 — --force vs --force-with-lease",
        text: "Quelle est la différence entre <code>git push --force</code> et <code>git push --force-with-lease</code> ?",
        code: "# Après un rebase, il faut forcer le push :\ngit push --force-with-lease origin feature",
        options: [
          "Il n'y a aucune différence, ce sont des alias",
          "--force-with-lease est plus rapide car il ne vérifie pas le serveur distant",
          "--force-with-lease vérifie que le distant n'a pas été modifié par quelqu'un d'autre avant d'écraser, --force écrase sans vérification",
          "--force écrase uniquement la branche locale, --force-with-lease écrase la branche distante"
        ],
        answer: 2,
        explanation: "<strong>--force-with-lease</strong> est une version sécurisée de --force. Elle vérifie que la référence distante n'a pas changé depuis votre dernier fetch. Si quelqu'un d'autre a poussé entre-temps, le push est rejeté, évitant ainsi d'écraser le travail d'un collègue."
      }
    ];

    let current = 0, score = 0, answered = false;
    const container = document.getElementById('quizContainer');
    const scoreContainer = document.getElementById('scoreContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function render() {
      if (current >= questions.length) return showScore();
      const q = questions[current];
      progressBar.style.width = ((current / questions.length) * 100) + '%';
      progressText.textContent = `Question ${current + 1} / ${questions.length}`;
      answered = false;
      let html = `<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;
      if (q.code) html += `<pre><code>${q.code}</code></pre>`;
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"><span>${opt}</span></label></li>`;
      });
      html += `</ul><button class="btn btn-primary" id="submitBtn" disabled onclick="checkAnswer()">Valider</button><div id="feedback" class="feedback"></div></div>`;
      container.innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(input => {
        input.addEventListener('change', () => { if (!answered) document.getElementById('submitBtn').disabled = false; });
      });
    }

    function checkAnswer() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const idx = parseInt(selected.value);
      const q = questions[current];
      const feedback = document.getElementById('feedback');
      if (idx === q.answer) {
        score++;
        feedback.className = 'feedback correct';
        feedback.innerHTML = `✅ Correct ! ${q.explanation}`;
      } else {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `❌ Incorrect. ${q.explanation}`;
      }
      document.getElementById('submitBtn').textContent = 'Suivant →';
      document.getElementById('submitBtn').onclick = () => { current++; render(); };
    }

    function showScore() {
      progressBar.style.width = '100%';
      progressText.textContent = `Terminé !`;
      container.innerHTML = '';
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? '🏆 Parfait !' : pct >= 60 ? '👍 Bien joué !' : '📚 À revoir';
      scoreContainer.innerHTML = `<div class="score">${score}/${questions.length}</div><div class="score-label">${pct}% — ${msg}</div><button class="btn-restart" onclick="location.reload()">🔄 Recommencer</button>`;
      scoreContainer.classList.remove('hidden');
    }

    render();
  </script>
</body>
</html>
