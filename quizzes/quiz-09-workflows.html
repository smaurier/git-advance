<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 09 — Workflows Collaboratifs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 09 — Workflows Collaboratifs</h1>
    <p class="subtitle">Code review, semver, CODEOWNERS, conventional commits</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1 — CODEOWNERS",
        text: "Quel est le rôle du fichier <code>CODEOWNERS</code> dans un dépôt GitHub ?",
        code: "# .github/CODEOWNERS\n*.ts       @team/frontend\n/api/**    @team/backend\n/docs/**   @team/docs\n*.yml      @devops-lead",
        options: [
          "Lister tous les contributeurs du projet avec leurs droits d'accès",
          "Assigner automatiquement des reviewers aux pull requests en fonction des fichiers modifiés",
          "Empêcher certains utilisateurs de modifier des fichiers spécifiques",
          "Générer un graphique de contribution pour chaque développeur"
        ],
        answer: 1,
        explanation: "Le fichier <strong>CODEOWNERS</strong> définit quels utilisateurs ou équipes sont automatiquement ajoutés comme reviewers lorsqu'une PR modifie des fichiers correspondant aux patterns définis. Cela garantit que les experts appropriés relisent toujours le code."
      },
      {
        label: "Question 2 — Semver",
        text: "Dans le versionnement sémantique (semver) <code>MAJOR.MINOR.PATCH</code>, quand doit-on incrémenter le numéro MAJOR ?",
        code: "# Exemples de versions semver :\n# 1.0.0 → 1.0.1  (patch: correction de bug)\n# 1.0.1 → 1.1.0  (minor: nouvelle fonctionnalité)\n# 1.1.0 → 2.0.0  (major: breaking change)",
        options: [
          "Quand on corrige un bug critique en production",
          "Quand on ajoute une nouvelle fonctionnalité rétrocompatible",
          "Quand on introduit un changement non rétrocompatible (breaking change)",
          "Quand on atteint 10 versions mineures"
        ],
        answer: 2,
        explanation: "En <strong>semver</strong> : MAJOR pour les changements non rétrocompatibles (breaking changes), MINOR pour les nouvelles fonctionnalités rétrocompatibles, PATCH pour les corrections de bugs. L'incrément MAJOR signale aux utilisateurs qu'une migration peut être nécessaire."
      },
      {
        label: "Question 3 — Conventional Commits",
        text: "Quel est le format d'un message de commit conventionnel (Conventional Commits) ?",
        code: "# Format : type(scope): description\n\n# Exemples valides :\nfeat(auth): ajouter la connexion OAuth Google\nfix(api): corriger le timeout des requêtes POST\ndocs(readme): mettre à jour les instructions d'installation\nfeat!: refonte complète de l'API REST",
        options: [
          "description - type [scope]",
          "type(scope): description",
          "[type] scope → description",
          "SCOPE/type: description"
        ],
        answer: 1,
        explanation: "Le format Conventional Commits est <strong>type(scope): description</strong>. Le type (feat, fix, docs, chore…) catégorise le changement. Le scope (optionnel) précise le module concerné. Un <code>!</code> après le type/scope indique un breaking change."
      },
      {
        label: "Question 4 — Stacked PRs",
        text: "Qu'est-ce que les « stacked PRs » (PRs empilées) ?",
        options: [
          "Des pull requests qui sont restées ouvertes trop longtemps et se sont accumulées",
          "Une chaîne de pull requests dépendantes où chaque PR est basée sur la précédente",
          "Des pull requests qui modifient le même fichier simultanément",
          "Un terme pour les PRs qui ont été refusées puis réouvertes"
        ],
        answer: 1,
        explanation: "Les <strong>stacked PRs</strong> sont une chaîne de pull requests où chaque PR est basée sur la branche de la PR précédente (au lieu de main). Cela permet de découper une grosse fonctionnalité en petites PRs reviewables indépendamment, tout en gardant les dépendances entre elles."
      },
      {
        label: "Question 5 — PR Template",
        text: "À quoi sert un template de pull request (PR template) ?",
        code: "# .github/pull_request_template.md\n## Description\n&lt;!-- Décrivez vos changements --&gt;\n\n## Type de changement\n- [ ] Bug fix\n- [ ] Nouvelle fonctionnalité\n- [ ] Breaking change\n\n## Checklist\n- [ ] Tests ajoutés\n- [ ] Documentation mise à jour",
        options: [
          "Générer automatiquement le code de la PR à partir d'un modèle",
          "Standardiser les informations fournies dans les pull requests avec une structure prédéfinie",
          "Empêcher la création de PR sans approbation préalable",
          "Créer automatiquement des branches à partir d'un template"
        ],
        answer: 1,
        explanation: "Un <strong>PR template</strong> pré-remplit la description de chaque nouvelle pull request avec une structure standardisée. Il guide les développeurs pour fournir les informations essentielles : description, type de changement, checklist de vérification, screenshots si nécessaire, etc."
      }
    ];

    let current = 0, score = 0, answered = false;
    const container = document.getElementById('quizContainer');
    const scoreContainer = document.getElementById('scoreContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function render() {
      if (current >= questions.length) return showScore();
      const q = questions[current];
      progressBar.style.width = ((current / questions.length) * 100) + '%';
      progressText.textContent = `Question ${current + 1} / ${questions.length}`;
      answered = false;
      let html = `<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;
      if (q.code) html += `<pre><code>${q.code}</code></pre>`;
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"><span>${opt}</span></label></li>`;
      });
      html += `</ul><button class="btn btn-primary" id="submitBtn" disabled onclick="checkAnswer()">Valider</button><div id="feedback" class="feedback"></div></div>`;
      container.innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(input => {
        input.addEventListener('change', () => { if (!answered) document.getElementById('submitBtn').disabled = false; });
      });
    }

    function checkAnswer() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const idx = parseInt(selected.value);
      const q = questions[current];
      const feedback = document.getElementById('feedback');
      if (idx === q.answer) {
        score++;
        feedback.className = 'feedback correct';
        feedback.innerHTML = `✅ Correct ! ${q.explanation}`;
      } else {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `❌ Incorrect. ${q.explanation}`;
      }
      document.getElementById('submitBtn').textContent = 'Suivant →';
      document.getElementById('submitBtn').onclick = () => { current++; render(); };
    }

    function showScore() {
      progressBar.style.width = '100%';
      progressText.textContent = `Terminé !`;
      container.innerHTML = '';
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? '🏆 Parfait !' : pct >= 60 ? '👍 Bien joué !' : '📚 À revoir';
      scoreContainer.innerHTML = `<div class="score">${score}/${questions.length}</div><div class="score-label">${pct}% — ${msg}</div><button class="btn-restart" onclick="location.reload()">🔄 Recommencer</button>`;
      scoreContainer.classList.remove('hidden');
    }

    render();
  </script>
</body>
</html>
